# manifests/50-backend/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: iot-monitoring
spec:
  replicas: 1
  selector:
    matchLabels: { app: backend }
  template:
    metadata:
      labels: { app: backend }
    spec:
      containers:
        - name: backend
          image: ilyasselm/iot-web-app:latest
          command: ["sh", "-c", "npm run dev:backend"]
          ports:
            - containerPort: 3001
          env:
            - name: INFLUXDB_URL
              value: "http://influxdb:8086"
            - name: INFLUXDB_ORG
              valueFrom:
                secretKeyRef: { name: influxdb-auth, key: DOCKER_INFLUXDB_INIT_ORG }
            - name: INFLUXDB_BUCKET
              valueFrom:
                secretKeyRef: { name: influxdb-auth, key: DOCKER_INFLUXDB_INIT_BUCKET }
            - name: INFLUXDB_TOKEN
              valueFrom:
                secretKeyRef: { name: influxdb-auth, key: DOCKER_INFLUXDB_INIT_ADMIN_TOKEN }
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 250m, memory: 256Mi }